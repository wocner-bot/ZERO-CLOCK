services:
  - type: web
    name: zero-clock
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: corepack pnpm install --frozen-lockfile --prod=false && corepack pnpm build:render
    startCommand: node scripts/run-render.mjs start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 24.21.0
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: '1'
      - key: DATABASE_PATH
        value: .data/news.sqlite
