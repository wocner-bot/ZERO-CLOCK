services:
  - type: web
    name: zero-clock
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: corepack enable && corepack prepare pnpm@11.25.0 --activate && pnpm install --frozen-lockfile && pnpm build:render
    startCommand: pnpm start:render
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 24.21.0
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: '1'
      - key: DATABASE_PATH
        value: .data/news.sqlite
